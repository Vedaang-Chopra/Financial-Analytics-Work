  - dataset_id: "nav_latest_open_ended"
    name: "Latest NAV - Open Ended Schemes"
    category: "nav"
    subcategory: "latest"
    description: "Current day NAV for all open-ended mutual fund schemes"
    url: "https://www.amfiindia.com/net-asset-value/nav-download"
    endpoint_type: "download_form"
    file_format: "text"  # Semicolon-delimited .txt (NAVAll.txt)
    reporting_frequency: "daily"
    historical_availability: "90 days max per request via NAV History form"
    date_parameters:
      - name: "from_date"
        required: true
        format: "DD-MMM-YYYY"
      - name: "to_date"
        required: true
        format: "DD-MMM-YYYY"
      - name: "fund_type"
        required: true
        values: ["Open Ended", "Close Ended", "Interval Fund"]
    scheme_identifiers: ["scheme_code", "isin_div_payout", "isin_div_reinvestment", "scheme_name", "plan", "option"]
    amc_identifiers: ["scheme_name contains AMC name"]
    pagination: false
    requires_browser: false
    sample_file: "NAVAll.txt (semicolon-delimited)"
    parser_status: "implemented"
    parser_name: "nav_text_v1"
    known_limitations:
      - "90-day limit per historical request"
      - "No direct API, form-based download"
      - "Must iterate by date ranges for full history"
      - "Form uses POST with viewstate"
    confidence: "high"
    priority: "primary"

