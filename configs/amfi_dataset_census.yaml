# ============================================================
# EXTRACTION STRATEGIES BY DATASET TYPE
# ============================================================

extraction_strategies:
  nav_history:
    primary: "static_html"  # Form POST with date iteration
    fallback: "playwright"  # If form has complex viewstate
    rate_limit: "2s between requests"
    backfill_approach: "iterate_90_day_windows"
    incremental_approach: "daily_latest_only"

  scheme_master_monthly:
    primary: "static_html"  # Direct Excel links on yearly pages
    fallback: "playwright"  # If JS-rendered
    rate_limit: "2s between requests"
    backfill_approach: "download_all_monthly_files"
    incremental_approach: "latest_month_only"

  aum_datasets:
    primary: "static_html"  # Form submissions
    fallback: "playwright"
    rate_limit: "3s between requests"
    backfill_approach: "iterate_financial_years"
    incremental_approach: "latest_quarter"

  ter_mf_schemes:
    primary: "static_html"  # Form with multiple filters
    fallback: "playwright"
    rate_limit: "3s between requests"
    backfill_approach: "iterate_months_with_filters"
    incremental_approach: "latest_month_all_amcs"

  amfi_monthly_data:
    primary: "static_html"  # Direct links on yearly pages
    fallback: "playwright"
    rate_limit: "2s between requests"
    backfill_approach: "download_all_monthly_files"
    incremental_approach: "latest_month"

  portfolio_disclosure:
    primary: "reference_only"
    note: "AMFI is index only; actual portfolios on AMC sites"
    strategy: "use_provider_first_principle"

# ============================================================
# GLOBAL SETTINGS
# ============================================================

global_settings:
  base_url: "https://www.amfiindia.com/"
  user_agent: "Mozilla/5.0 (compatible; FinancialAnalyticsBot/1.0; +https://github.com/financial-analytics)"
  default_timeout: 30
  max_retries: 3
  retry_backoff: 2
  respect_robots_txt: true
  polite_crawling: true