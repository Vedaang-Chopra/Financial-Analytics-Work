# AMFI Dataset Census
# Machine-readable catalog of all official AMFI mutual fund datasets
# Discovered by inspecting https://www.amfiindia.com/
# This is the primary source of truth for what AMFI provides

census_version: "1.0"
census_date: "2026-08-21"
