# ============================================================
# STRATEGY PATTERNS OBSERVED (for reuse)
# ============================================================

strategy_patterns:
  - pattern_id: "static_disclosure_page"
    description: "Static HTML page with direct links to Excel/CSV/PDF files"
    examples: ["PPFAS", "DSP", "Groww"]
    extractor: "static_html"
    parser: "portfolio_excel_v1"
    reusable: true
    
  - pattern_id: "tabbed_portal"
    description: "Tabbed interface (Monthly/Fortnightly/Quarterly) requiring JS to reveal content"
    examples: ["Mirae Asset", "Invesco"]
    extractor: "playwright"
    parser: "portfolio_excel_v1"
    reusable: true
    
  - pattern_id: "react_dropdown_filter"
    description: "React app with dropdown filters (Financial Year, Document Type) triggering downloads"
    examples: ["ICICI Prudential"]
    extractor: "playwright_vlm"
    parser: "portfolio_zip_v1"
    reusable: true
    
  - pattern_id: "accordion_dynamic"
    description: "Dynamic accordion/collapse sections loading content via JS"
    examples: ["Aditya Birla"]
    extractor: "playwright_vlm"
    parser: "portfolio_excel_v1"
    reusable: true
    
  - pattern_id: "amfi_form_download"
    description: "AMFI form-based downloads with date/AMC/type filters"
    examples: ["NAV History", "TER", "AUM"]
    extractor: "static_html"  # Form POST
    parser: "nav_text_v1"
    reusable: true
    
  - pattern_id: "amfi_direct_links"
    description: "AMFI yearly pages with direct monthly/quarterly Excel links"
    examples: ["AMFI Monthly", "Scheme Master Monthly"]
    extractor: "static_html"
    parser: "scheme_master_excel_v1"
    reusable: true

